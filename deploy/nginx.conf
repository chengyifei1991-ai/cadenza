# Cadenza Web（前端容器）：静态资源 + /api、/mcp、/healthz、/v1/opamp 反代到后端
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip              on;
    gzip_types        text/plain text/css application/json application/javascript image/svg+xml;
    client_max_body_size 2m;

    # SPA（前端路由回退 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 与后端连接稳定性（POST 不自动重试，避免审批/下发重复提交；后端起速慢时无需干预）
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    300s;

    # REST API
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie $http_cookie;
        proxy_buffering    off;   # SSE（对话流式预留）
    }

    # 健康检查
    location = /healthz {
        proxy_pass         http://backend:8080/healthz;
        proxy_http_version 1.1;
    }

    # MCP（streamable HTTP）
    location /mcp {
        proxy_pass         http://backend:8080/mcp;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }

    # OpAMP WebSocket（Collector 接入）
    location /v1/opamp {
        proxy_pass         http://backend:8080/v1/opamp;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
