name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build / vet / test / fmt / license
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build & embed Web UI
        run: |
          npm --prefix web ci
          npm --prefix web run build
          node web/scripts/embed.mjs

      - name: Frontend typecheck & unit tests（Vitest）
        run: |
          npm --prefix web run typecheck
          npm --prefix web test

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Format check
        run: test -z "$(gofmt -l cmd internal)"

      - name: SPDX header check
        run: |
          missing=$(find cmd internal -name '*.go' | while read f; do
            grep -q 'SPDX-License-Identifier' "$f" || echo "$f"
          done)
          if [ -n "$missing" ]; then
            echo "以下 .go 文件缺少 SPDX 头："
            echo "$missing"
            exit 1
          fi
          echo "SPDX 头齐全"

  e2e:
    name: e2e 黑盒回归（simple + off）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build server & passwd tool
        run: |
          go build -o bin/cadenza ./cmd/server
          go build -o bin/cadenza-passwd ./cmd/cadenza-passwd

      - name: Build & embed Web UI
        run: |
          npm --prefix web ci
          npm --prefix web run build
          node web/scripts/embed.mjs
          go build -o bin/cadenza ./cmd/server   # embed 后重编，产物含 UI

      - name: E2E（simple 鉴权模式）
        run: ./tests/e2e.sh

      - name: E2E（免登模式）
        run: E2E_AUTH=off E2E_PORT=18763 ./tests/e2e.sh

  ui-e2e:
    name: UI E2E（Playwright，V1 GA 门禁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build & embed UI + binaries
        run: |
          npm --prefix web ci
          npm --prefix web run build
          node web/scripts/embed.mjs
          go build -o bin/cadenza ./cmd/server
          go build -o bin/cadenza-passwd ./cmd/cadenza-passwd

      - name: Install Playwright chromium（含系统依赖）
        run: |
          cd web
          npx playwright install --with-deps chromium

      - name: UI E2E（登录→仪表盘→Collectors→编辑器审批闭环→AI 助手）
        run: npm --prefix web run test:e2e

  dco:
    name: DCO 签章检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: DCO check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            range="${base}..${head}"
          else
            range="HEAD~1..HEAD"
          fi
          bad=$(git log --format='%H' "$range" | while read c; do
            git show -s --format='%B' "$c" | grep -q '^Signed-off-by:' || echo "$c"
          done)
          if [ -n "$bad" ]; then
            echo "以下提交缺少 Signed-off-by（DCO）："
            echo "$bad"
            exit 1
          fi
          echo "DCO 通过"
