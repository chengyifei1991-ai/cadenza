# Cadenza 1.0.0 GA — 前后端分离容器部署（docker compose / nerdctl compose 均可）
#
#   backend : cadenza 单后端（OpAMP/MCP/REST，演示数据 DEMO_MODE，免登 WEB_AUTH_MODE=off）
#   web     : nginx 托管前端静态（挂载 web/dist）+ 反代 /api /mcp /v1/opamp /healthz
#
# 启动（Windows 浏览器访问 http://localhost:8081）：
#   cd 仓库根
#   npm --prefix web run build                    # 先产出前端产物（已含则跳过）
#   docker compose -f docker-compose.ga.yml up -d --build
#   或（Rancher Desktop）：nerdctl compose -f docker-compose.ga.yml up -d --build
name: cadenza-ga

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cadenza:1.0.0
    container_name: cadenza-backend
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DB_DRIVER: "sqlite"
      DB_SQLITE_PATH: "/data/cadenza.db"
      DEMO_MODE: "true"
      WEB_AUTH_MODE: "off"            # 本地便捷查看（对外部署请改 simple + WEB_ADMIN_PASSWORD_HASH）
      WEB_ADMIN_USER: "admin"
      WEB_ADMIN_PASSWORD_HASH: "${WEB_ADMIN_PASSWORD_HASH:-}"
      LLM_API_KEY: "${LLM_API_KEY:-not-used}"
      LLM_MODEL: "deepseek-chat"
      REQUIRE_APPROVAL: "true"
      STRICT_VALIDATE: "false"
    volumes:
      - cadenza-data:/data
    # 不直接暴露宿主机端口：仅经 web 反代访问（前后端分离）
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: nginx:1.27-alpine
    container_name: cadenza-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "0.0.0.0:8081:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  cadenza-data:
